# Main Hugo configuration.
# baseURL is overridden by the GitHub Actions deploy; keep a sensible local default.
baseURL = "https://johannphilippe.github.io/"
title = "Johann Philippe"

# Multilingual: French is the default (served at /), English lives under /en/.
defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = false

# Agenda events are dated in the future. Without this, Hugo silently drops them
# from the build and the "upcoming" section is always empty.
buildFuture = true

enableEmoji = false
enableInlineShortcodes = true
summaryLength = 30

# Generate /robots.txt (see layouts/robots.txt) pointing crawlers at the sitemap.
enableRobotsTXT = true

# We don't use tags/categories as taxonomies (music filters on a plain `category`
# front-matter field). Disabling them avoids publishing empty /tags/ and
# /categories/ pages, which are dead weight for search engines.
# NOTE: these must stay ABOVE any [table] header — TOML would otherwise nest them.
disableKinds = ["taxonomy", "term"]

# Markdown: allow raw HTML (needed for embeds), sober defaults.
[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    style = "bw"
