# Site-wide parameters. Edit these without touching any template.

# --- Feature toggles ---------------------------------------------------------
# Set agenda = false to remove the Agenda section from navigation entirely.
agenda = true

# --- Home ---------------------------------------------------------------------
# Hero image at the top of the home page. Either:
#   - a local file placed in  assets/  (e.g. "img/home.jpg") — RECOMMENDED:
#     it is optimised at build time (resized to 2000px wide + converted to WebP);
#   - or a full https:// URL (used as-is, no optimisation).
# Leave empty ("") to hide it.
home_image = "img/4juin.jpg"
# Optional caption shown under the hero (small, dim). Leave empty to hide.
home_caption = ""
# Optional photo credit for the hero, shown as a small "© …" corner overlay.
home_image_credit = ""

# --- Aesthetic ---------------------------------------------------------------
# Single restrained accent colour (used for links, active nav, rules-on-hover).
# Muted amber by default; swap for any CSS colour.
accent = "#c8a24a"
# Subtle film-grain overlay. Set to false for a perfectly flat surface.
grain = true

# --- Contact links -----------------------------------------------------------
# Add as many as you like; each becomes a link on the About page and footer.
# `name` is shown, `url` is the target. Order = display order.
[[contact]]
  name = "Email"
  url = "mailto:johann.philippe1992@gmail.com"
[[contact]]
  name = "GitHub"
  url = "https://github.com/johannphilippe"
[[contact]]
  name = "Bandcamp"
  url = "https://bandcamp.com/"
[[contact]]
  name = "SoundCloud"
  url = "https://soundcloud.com/johannphilippe"
