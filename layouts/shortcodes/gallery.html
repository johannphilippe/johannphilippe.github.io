{{- /* Inline gallery inside an article body. Usage:
       {{< gallery "img1.jpg" "https://…/img2.jpg" "img3.jpg" >}} */ -}}
<div class="gallery">
  {{- range .Params -}}
    {{- $src := partial "resolve-img.html" (dict "p" $.Page "src" .) -}}
    <a href="{{ $src }}" target="_blank"><img src="{{ $src }}" alt="" loading="lazy"></a>
  {{- end -}}
</div>
